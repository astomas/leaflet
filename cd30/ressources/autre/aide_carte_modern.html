<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Aide si3p0</title>
    <link rel="stylesheet" href="/Ressources/API_JS/librairies_cd30/leaflet-si3p0.css">
    <style>
		html {
			background-color: #f0f0f0;
		}
		body {
			font-family: Montserrat, Lato, Verdana, Sans-Serif;
			background: transparent;
			font-size: 0.83em;
			padding: 0 15px;
			margin: 0;
		}
		.page-layout {
			display: flex;
			gap: 20px;
			align-items: flex-start;
			margin-top: 25px;
		}
		.col-gauche {
			flex: 0 0 calc(56.667% - 10px);
			min-width: 0;
			display: flex;
			flex-direction: column;
			align-items: flex-start;
			gap: 15px;
		}
		.img-carte {
			width: 100%;
			height: auto;
			border-radius: 5px;
		}
		.liens-haut {
			display: inline-flex;
			flex-direction: column;
			gap: 10px;
			background-color: #e8e8e8;
			border-radius: 8px;
			padding: 12px 15px;
			margin: 0;
		}		
		.liens-haut a {
			display: flex;
			align-items: center;
			gap: 8px;
			text-decoration: none;
			color: #333;
			font-weight: bold;
			font-size: 1.1em;
			padding: 6px 8px;
			border-radius: 5px;
			transition: background-color 0.2s;
		}
		.liens-haut a:hover {
			background-color: #d0d0d0;
			color: #0000EE;
		}	
		.liens-haut a {
			border-bottom: 1px solid #ccc;
			padding-bottom: 10px;
		}
		.liens-haut a:last-child {
			border-bottom: none;
		}		
		.contenu-aide {
			box-sizing: border-box;
			height: 800px;   /* hauteur maîtrisée (ne suit plus la largeur) */
			object-fit: fill;
			background-color: #fde8c8;
			padding: 20px;
			flex: 0 0 calc(43.333% - 10px);
			min-width: 0;
			border-radius: 5px;
		}
		.titre-centre {
			text-align: center;
			margin-bottom: 20px;
			margin-top: 0;
			color: #007079;
			font-size: 1.7em;
		}

    </style>
</head>

<body>
<div class="page-layout">
	<div class="col-gauche">
		<!-- Carte -->
		<img src="./carte_new.png" alt="Carte" class="img-carte">
		<!-- Liens tutoriels -->
		<div class="liens-haut">
			<a href="./Tutorial_Si3p0.ppsx">
				<img src="./powerpoint.png" width="28" height="28"> Tutoriel carte dynamique Si3p0
			</a>
			<!-- <a href="./Recherche élément de couche.mp4" target="_blank"> -->
			<!-- <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="#c00"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V4h-4z"/></svg> -->
			<!-- Rechercher un élément de couche -->
		<!-- </a> -->
		</div>
	</div>
	<!-- Contenu aide -->
	<img src="./contenu_aide.png" alt="Aide" class="contenu-aide">
</div>
</body>
</html>
