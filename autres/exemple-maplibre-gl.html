<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Exemple - plugin Leaflet maplibre-gl</title>

<!-- 1) Leaflet (dans les autres pages du dépôt : /leaflet/Ressources 26/librairies_cd30/leaflet.js) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- 2) MapLibre GL JS : son CSS est OBLIGATOIRE (sinon le canvas est mal positionné).
     Version 5.x impérative ici : depuis la 6.0, MapLibre ne publie plus de build UMD
     (dist/maplibre-gl.js n'existe plus, seulement dist/maplibre-gl.mjs), il n'y a donc
     plus de variable globale 'maplibregl' pour un chargement par simple <script>. -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>

<!-- 3) Le plugin : il doit être chargé APRÈS Leaflet et MapLibre -->
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>

<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { height: 100%; }
  .panneau { background: #fff; padding: 8px 10px; border-radius: 6px; box-shadow: 0 1px 5px rgba(0,0,0,.4); font-size: 13px; line-height: 1.7; }
  .panneau button { display: block; width: 100%; margin: 2px 0; cursor: pointer; }
  .panneau label { display: block; margin-top: 6px; }
  .panneau input[type=range] { width: 100%; }
</style>
</head>
<body>
<div id="map"></div>

<script>
/* ------------------------------------------------------------------
   Carte Leaflet classique : c'est toujours Leaflet qui pilote la vue
   (centre, zoom, interactions). MapLibre n'est qu'une couche de rendu.
   Aucune option particulière ici : les fonds raster gardent le comportement
   standard de Leaflet (voir plus bas le mode vectoriel, activé à la demande).
   ------------------------------------------------------------------ */
var map = L.map('map').setView([43.8367, 4.3601], 13);   // Nîmes

/* Réglages d'origine, mémorisés pour pouvoir les restaurer à l'identique. */
var REGLAGES_ORIGINE = {
  zoomAnime: map._zoomAnimated,
  wheelPx: map.options.wheelPxPerZoomLevel,
  wheelDebounce: map.options.wheelDebounceTime
};

/* Fond raster "témoin", pour comparer avec les fonds vectoriels */
var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap'
});

/* ------------------------------------------------------------------
   LE PLUGIN : L.maplibreGL(options)
   - style  : URL (ou objet) d'un style MapLibre / Mapbox GL
   - pane   : 'tilePane' est la valeur par défaut ; le canvas WebGL reste
              donc sous les objets Leaflet (marqueurs, GeoJSON, popups)
   - attributionControl : le plugin désactive le contrôle natif de MapLibre
              et reprend par défaut l'attribution déclarée dans les sources du
              style ; on peut la forcer avec { customAttribution: ... }
   - fadeDuration : défaut 300 ms, supprime le fondu des libellés à chaque zoom
   Toutes les autres options sont transmises telles quelles au constructeur
   maplibregl.Map (bearing, pitch, maxZoom, transformRequest...).
   Attention : le plugin cale la vue GL sur <zoom Leaflet - 1> (tuiles 512 px
   côté vecteur, 256 px côté Leaflet) ; les expressions de style dépendantes
   du zoom sont donc décalées d'un niveau.
   ------------------------------------------------------------------ */
var ATTRIBUTION_IGN = '&copy; <a href="https://www.ign.fr/">IGN</a> - Géoplateforme';

function coucheVectorielle(urlStyle) {
  return L.maplibreGL({
    style: urlStyle,
    pane: 'tilePane',
    fadeDuration: 0,
    validateStyle: false,       // voir l'explication ci-dessous
    attributionControl: { customAttribution: ATTRIBUTION_IGN }
  });
}

/* validateStyle: false est INDISPENSABLE avec transparent.json.
   Ce style porte une propriété fill-opacity sur des couches qui ne sont pas
   de type fill (background, line, symbol...), ce que le validateur de
   MapLibre refuse. Or dans Style._load, la moindre erreur de validation
   annule le chargement du style ENTIER : la carte reste vide.
   En désactivant la validation, le style se charge et MapLibre ignore
   simplement la propriété qu'il ne sait pas appliquer. */

var planStandard = coucheVectorielle('https://data.geopf.fr/annexes/ressources/vectorTiles/styles/PLAN.IGN/standard.json');
var planGris     = coucheVectorielle('https://data.geopf.fr/annexes/ressources/vectorTiles/styles/PLAN.IGN/gris.json');
var planTransparent = coucheVectorielle('https://data.geopf.fr/annexes/ressources/vectorTiles/styles/PLAN.IGN/transparent.json');


/* ------------------------------------------------------------------
   FLUIDITÉ DU ZOOM, uniquement quand un fond vectoriel est affiché.

   Le problème : pendant son animation de zoom, Leaflet se contente d'étirer
   le canvas WebGL en CSS (image agrandie, donc floue), puis MapLibre
   redessine proprement à la fin. On perçoit deux images par cran de zoom,
   très visible en zoom/dézoom rapide. Les fonds raster, eux, n'ont pas ce
   défaut : inutile de les pénaliser.

   D'où une bascule branchée sur les événements 'layeradd' et 'layerremove'
   de la carte : L.Control.Layers retire toujours l'ancien fond AVANT
   d'ajouter le nouveau, donc les réglages standard sont bien rétablis quand
   un fond raster s'initialise, et réappliqués si l'on passe d'un fond
   vectoriel à l'autre.

   map._zoomAnimated est une propriété interne de Leaflet, mais elle est relue
   à chaque zoom : la modifier en cours de route fonctionne, alors que
   map.options.zoomAnimation n'est lu qu'à la création de la carte.
   Pour comparer avec le comportement par défaut, commenter les deux
   map.on(...) plus bas.

   Le tri se fait sur le type de couche (instanceof L.MaplibreGL) : ajouter
   un nouveau style vectoriel ne demande donc aucune modification ici.
   ------------------------------------------------------------------ */
function activerModeVectoriel() {
  map._zoomAnimated = false;                 // un seul rendu net par cran
  map.options.wheelPxPerZoomLevel = 120;     // défaut 60 : molette moins nerveuse
  map.options.wheelDebounceTime = 100;       // défaut 40 ms : moins de crans enchaînés
}

function restaurerModeStandard() {
  map._zoomAnimated = REGLAGES_ORIGINE.zoomAnime;
  map.options.wheelPxPerZoomLevel = REGLAGES_ORIGINE.wheelPx;
  map.options.wheelDebounceTime = REGLAGES_ORIGINE.wheelDebounce;
}

/* ------------------------------------------------------------------
   Données métier ajoutées DANS le moteur vectoriel (rendu GPU).
   À réserver aux gros volumes : au-delà de quelques milliers d'objets,
   c'est nettement plus fluide qu'un L.geoJSON classique.
   ------------------------------------------------------------------ */
var chantiers = {
  type: 'FeatureCollection',
  features: [
    { type: 'Feature', properties: { nom: 'RD 999 - PR 12', etat: 'en cours' }, geometry: { type: 'Point', coordinates: [4.330, 43.845] } },
    { type: 'Feature', properties: { nom: 'RD 6113 - PR 3',  etat: 'terminé'  }, geometry: { type: 'Point', coordinates: [4.390, 43.828] } },
    { type: 'Feature', properties: { nom: 'RD 907 - PR 45',  etat: 'en cours' }, geometry: { type: 'Point', coordinates: [4.365, 43.855] } }
  ]
};

function ajouterCouchesMetier(gl) {
  if (gl.getSource('chantiers')) return;          // déjà présentes
  gl.addSource('chantiers', { type: 'geojson', data: chantiers });
  gl.addLayer({
    id: 'chantiers-pts',
    type: 'circle',
    source: 'chantiers',
    paint: {
      'circle-radius': 7,
      'circle-color': ['match', ['get', 'etat'], 'en cours', '#e8590c', '#2b8a3e'],
      'circle-stroke-width': 2,
      'circle-stroke-color': '#fff'
    }
  });
}

/* ------------------------------------------------------------------
   Branchement commun aux couches vectorielles.

   Point important : le plugin détruit l'objet maplibregl.Map dans son
   onRemove et en recrée un neuf au prochain onAdd. On ne peut donc PAS
   mémoriser getMaplibreMap() une fois pour toutes : les écouteurs sont
   (ré)installés à chaque ajout de la couche.

   Le style est chargé en asynchrone : toute addSource/addLayer faite trop
   tôt lève une erreur, d'où l'attente de l'évènement 'load'. 'styledata'
   rejoue l'ajout après un éventuel setStyle(), qui remet le style à zéro
   et supprime les couches personnalisées.
   ------------------------------------------------------------------ */
/* layeradd se déclenche pour TOUTE couche ajoutée (marqueurs, popups, fond
   raster...). Le test instanceof L.MaplibreGL fait le tri sur le TYPE de la
   couche plutôt que sur une liste nominative : n'importe quelle couche
   vectorielle créée ensuite est prise en charge sans rien modifier ici.
   L.MaplibreGL est la classe exportée par le plugin (L.maplibreGL() en est
   la fabrique, avec un m minuscule). */
function estCoucheVectorielle(couche) {
  return couche instanceof L.MaplibreGL;
}

map.on('layeradd', function (e) {
  if (!estCoucheVectorielle(e.layer)) { return; }

  activerModeVectoriel();
  var gl = e.layer.getMaplibreMap();
  gl.on('load', function () { ajouterCouchesMetier(gl); appliquerTransparence(); });
  gl.on('styledata', function () { ajouterCouchesMetier(gl); appliquerTransparence(); });
  gl.on('error', function (ev) {       // style introuvable, tuiles en erreur...
    console.error('MapLibre :', ev && ev.error ? ev.error.message : ev);
  });
});

map.on('layerremove', function (e) {
  if (estCoucheVectorielle(e.layer)) { restaurerModeStandard(); }
});

/* La couche n'est ajoutée que maintenant : layeradd ne déclenche que les
   écouteurs déjà en place, donc addTo() doit venir après les map.on(). */
planStandard.addTo(map);

/* Renvoie la carte MapLibre du fond vectoriel actuellement affiché, ou null
   si c'est un fond raster qui est sélectionné. */
function glActif() {
  var gl = null;
  map.eachLayer(function (couche) {
    if (estCoucheVectorielle(couche)) { gl = couche.getMaplibreMap(); }
  });
  return gl;
}

/* ------------------------------------------------------------------
   Objets Leaflet habituels : ils restent au-dessus du canvas WebGL
   grâce au pane 'tilePane' choisi plus haut.
   ------------------------------------------------------------------ */
L.marker([43.8367, 4.3601]).addTo(map)
 .bindPopup('Marqueur <b>Leaflet</b> au-dessus du fond vectoriel MapLibre.');

/* Sélecteur de fonds : le plugin se comporte comme n'importe quelle couche
   Leaflet (add/remove, contrôle de couches, opacité de pane...). */
L.control.layers({
  'Plan IGN vectoriel': planStandard,
  'Plan IGN vectoriel (gris)': planGris,
  'Plan IGN vectoriel (transparent)': planTransparent,
  'OSM (raster)': osm
}, null, { collapsed: false }).addTo(map);

/* ------------------------------------------------------------------
   TRANSPARENCE DU FOND VECTORIEL

   Il n'existe pas de propriété d'opacité globale sur une carte MapLibre :
   l'opacité se règle couche de style par couche de style, et le NOM de la
   propriété dépend du type de la couche. C'est la source de l'erreur
   « unknown property "fill-opacity" » : fill-opacity n'est valide que sur
   une couche de type fill, pas sur un background, une line ou un symbol.
   MapLibre valide chaque propriété contre le type de la couche visée,
   ignore celle qu'il refuse (l'erreur n'est pas bloquante) et continue.

   D'où cette table de correspondance type -> propriétés d'opacité.
   ------------------------------------------------------------------ */
var PROPS_OPACITE = {
  'background':     ['background-opacity'],
  'fill':           ['fill-opacity'],
  'line':           ['line-opacity'],
  'symbol':         ['icon-opacity', 'text-opacity'],
  'circle':         ['circle-opacity'],
  'raster':         ['raster-opacity'],
  'fill-extrusion': ['fill-extrusion-opacity'],
  'heatmap':        ['heatmap-opacity']
};

var opaciteFond = 1;

function appliquerTransparence() {
  var gl = glActif();
  if (!gl || !gl.isStyleLoaded()) { return; }

  gl.getStyle().layers.forEach(function (couche) {
    if (couche.id.indexOf('chantiers') === 0) { return; }   // nos données restent opaques
    var props = PROPS_OPACITE[couche.type] || [];
    props.forEach(function (prop) {
      gl.setPaintProperty(couche.id, prop, opaciteFond);
    });
  });
}

/* ------------------------------------------------------------------
   Panneau de démonstration des actions "vecteur"
   ------------------------------------------------------------------ */
var Panneau = L.Control.extend({
  options: { position: 'topright' },
  onAdd: function () {
    var div = L.DomUtil.create('div', 'panneau');
    div.innerHTML = '<b>Actions MapLibre</b>';
    L.DomEvent.disableClickPropagation(div);        // sinon les clics zooment la carte
    L.DomEvent.disableScrollPropagation(div);       // et la molette sur le curseur

    bouton(div, 'Libellés on/off', basculerLibelles);
    bouton(div, 'Points chantiers on/off', basculerChantiers);

    var ligne = L.DomUtil.create('label', '', div);
    ligne.textContent = 'Opacité du fond ';
    var curseur = L.DomUtil.create('input', '', ligne);
    curseur.type = 'range';
    curseur.min = 0; curseur.max = 100; curseur.value = 100;
    L.DomEvent.on(curseur, 'input', function () {
      opaciteFond = curseur.value / 100;
      appliquerTransparence();
    });
    return div;
  }
});
function bouton(parent, texte, action) {
  var b = L.DomUtil.create('button', '', parent);
  b.textContent = texte;
  L.DomEvent.on(b, 'click', action);
}
map.addControl(new Panneau());

/* Masquer tous les libellés : on parcourt les couches du style et on
   bascule la propriété de layout 'visibility' des couches de type symbol. */
var libellesVisibles = true;
function basculerLibelles() {
  var gl = glActif();
  if (!gl) return;
  libellesVisibles = !libellesVisibles;
  gl.getStyle().layers
    .filter(function (c) { return c.type === 'symbol'; })
    .forEach(function (c) {
      gl.setLayoutProperty(c.id, 'visibility', libellesVisibles ? 'visible' : 'none');
    });
}

function basculerChantiers() {
  var gl = glActif();
  if (!gl || !gl.getLayer('chantiers-pts')) return;
  var v = gl.getLayoutProperty('chantiers-pts', 'visibility');
  gl.setLayoutProperty('chantiers-pts', 'visibility', v === 'none' ? 'visible' : 'none');
}

/* Interrogation des objets vectoriels : le clic est capté par Leaflet.
   Le canvas WebGL est plus grand que la carte (option 'padding' du plugin) :
   ses coordonnées écran ne sont donc PAS celles de e.containerPoint.
   On repasse par gl.project(), qui rend le point dans le repère du canvas,
   puis on interroge une petite boîte de 10 px pour la tolérance de clic. */
map.on('click', function (e) {
  var gl = glActif();
  if (!gl || !gl.getLayer('chantiers-pts')) return;
  var p = gl.project([e.latlng.lng, e.latlng.lat]);
  var objets = gl.queryRenderedFeatures(
    [[p.x - 5, p.y - 5], [p.x + 5, p.y + 5]],
    { layers: ['chantiers-pts'] }
  );
  if (objets.length) {
    L.popup().setLatLng(e.latlng)
      .setContent('<b>' + objets[0].properties.nom + '</b><br>État : ' + objets[0].properties.etat)
      .openOn(map);
  }
});
</script>
</body>
</html>
